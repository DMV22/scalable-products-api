x-api-common: &api-common
  build: .
  expose:
    - "3000"
  restart: unless-stopped

services:
  api1:
    <<: *api-common
    environment:
      PORT: 3000
      INSTANCE_ID: api-1

  api2:
    <<: *api-common
    environment:
      PORT: 3000
      INSTANCE_ID: api-2

  api3:
    <<: *api-common
    environment:
      PORT: 3000
      INSTANCE_ID: api-3

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3